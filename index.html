<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>タイマー (04:00)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-stop: #ef4444;
      --accent-stop-hover: #dc2626;
      --circle-bg: #334155;
      --circle-progress: #38bdf8;
      --flash-bg: #451a03;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      transition: background-color 0.3s ease;
      touch-action: manipulation;
    }

    body.finished-flash {
      animation: flash 1s infinite alternate;
    }

    @keyframes flash {
      0% { background-color: var(--bg-color); }
      100% { background-color: var(--flash-bg); }
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem 1.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      position: relative;
    }

    /* Sound Mute Toggle Button */
    .mute-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 1.25rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .mute-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .mute-btn.muted {
      color: #ef4444;
    }

    /* Timer Display with SVG Circle */
    .timer-display-container {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .progress-ring {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .progress-ring__circle-bg {
      stroke: var(--circle-bg);
      stroke-width: 10;
      fill: transparent;
    }

    .progress-ring__circle {
      stroke: var(--circle-progress);
      stroke-width: 10;
      stroke-linecap: round;
      fill: transparent;
      transition: stroke-dashoffset 0.3s linear, stroke 0.3s;
    }

    .timer-text-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-time {
      font-size: 3.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.05em;
    }

    /* Preset Quick Buttons */
    .presets {
      display: flex;
      gap: 0.4rem;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .preset-btn {
      background-color: var(--circle-bg);
      color: var(--text-main);
      border: none;
      padding: 0.5rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
      min-width: 42px;
      text-align: center;
    }

    .preset-btn:active {
      transform: scale(0.95);
    }

    .preset-btn.active {
      background-color: var(--primary);
      color: #0f172a;
    }

    /* Fine Adjust Buttons (+1m / -1m) */
    .adjust-group {
      display: flex;
      gap: 1rem;
      width: 100%;
    }

    .adjust-btn {
      flex: 1;
      background-color: transparent;
      border: 1px solid var(--circle-bg);
      color: var(--text-main);
      padding: 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .adjust-btn:active {
      background-color: var(--circle-bg);
    }

    /* Main Controls (Vertical Stack: Big Start on Top, Small Reset on Bottom) */
    .controls-vertical {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      align-items: center;
    }

    .btn {
      font-weight: 700;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    /* Big Main Start/Pause Button */
    .btn-main {
      width: 100%;
      padding: 1rem;
      font-size: 1.3rem;
      border-radius: 0.85rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0f172a;
    }

    .btn-primary:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    .btn-danger {
      background-color: var(--accent-stop);
      color: #ffffff;
    }

    .btn-danger:active {
      transform: scale(0.98);
      background-color: var(--accent-stop-hover);
    }

    /* Small Reset Button below */
    .btn-small {
      width: 60%;
      padding: 0.45rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      background-color: transparent;
      color: var(--text-sub);
      border: 1px solid var(--circle-bg);
      box-shadow: none;
    }

    .btn-small:active {
      transform: scale(0.96);
      background-color: var(--circle-bg);
      color: var(--text-main);
    }

    /* Key Hint */
    .key-hint {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="mute-btn" id="muteBtn" title="音量切替 (Mute)">🔊</button>

    <div class="timer-display-container">
      <svg class="progress-ring">
        <circle class="progress-ring__circle-bg" cx="110" cy="110" r="95"></circle>
        <circle class="progress-ring__circle" id="progressCircle" cx="110" cy="110" r="95"></circle>
      </svg>
      <div class="timer-text-group">
        <div class="timer-time" id="timeDisplay">04:00</div>
      </div>
    </div>

    <!-- プリセット切替 -->
    <div class="presets">
      <button class="preset-btn" data-time="180">3分</button>
      <button class="preset-btn active" data-time="240">4分</button>
      <button class="preset-btn" data-time="300">5分</button>
      <button class="preset-btn" data-time="360">6分</button>
      <button class="preset-btn" data-time="420">7分</button>
      <button class="preset-btn" data-time="480">8分</button>
    </div>

    <!-- ±1分 微調整 -->
    <div class="adjust-group">
      <button class="adjust-btn" id="minusMinBtn">-1分</button>
      <button class="adjust-btn" id="plusMinBtn">+1分</button>
    </div>

    <!-- 縦並びの操作ボタン（上が大きなスタート、下が小さなリセット） -->
    <div class="controls-vertical">
      <button class="btn btn-main btn-primary" id="startPauseBtn">
        <span id="btnIcon">▶</span> <span id="btnText">スタート</span>
      </button>
      <button class="btn btn-small" id="resetBtn">リセット</button>
    </div>

    <div class="key-hint">Space: スタート/一時停止 | R: リセット</div>
  </div>

  <script>
    // State Management
    let totalSeconds = 240; // Default 4 minutes
    let remainingSeconds = 240;
    let timerInterval = null;
    let isRunning = false;
    let isMuted = false;
    let halfAnnounced = false;

    // DOM Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const btnIcon = document.getElementById('btnIcon');
    const btnText = document.getElementById('btnText');
    const resetBtn = document.getElementById('resetBtn');
    const muteBtn = document.getElementById('muteBtn');
    const progressCircle = document.getElementById('progressCircle');
    const presetBtns = document.querySelectorAll('.preset-btn');
    const plusMinBtn = document.getElementById('plusMinBtn');
    const minusMinBtn = document.getElementById('minusMinBtn');

    // Circular Progress Setup
    const radius = progressCircle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;

    function setProgress(percent) {
      const offset = circumference - (percent / 100) * circumference;
      progressCircle.style.strokeDashoffset = offset;
    }

    // Audio Context Setup (Web Audio API)
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Web Speech API Synthesis
    function speak(text) {
      if (isMuted) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        uttr.rate = 1.0;
        uttr.pitch = 1.0;
        uttr.volume = 1.0;
        window.speechSynthesis.speak(uttr);
      }
    }

    // Electronic Beep Alarm
    function playAlarmSound() {
      if (isMuted) return;
      initAudioContext();
      
      const now = audioCtx.currentTime;
      const beepCount = 4;
      
      for (let i = 0; i < beepCount; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now + i * 0.25);
        
        gain.gain.setValueAtTime(0.3, now + i * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.25 + 0.18);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now + i * 0.25);
        osc.stop(now + i * 0.25 + 0.18);
      }
    }

    // Display & UI Updates
    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      timeDisplay.textContent = formatted;
      document.title = isRunning ? `(${formatted}) タイマー` : `タイマー (${formatted})`;

      const percent = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
      setProgress(percent);
    }

    // Timer Logic
    function startTimer() {
      initAudioContext();
      if (remainingSeconds <= 0) return;

      isRunning = true;
      startPauseBtn.classList.remove('btn-primary');
      startPauseBtn.classList.add('btn-danger');
      btnIcon.textContent = '⏸';
      btnText.textContent = '一時停止';

      // 開始アナウンス
      if (remainingSeconds === totalSeconds) {
        speak('スタートー');
      }

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();

          // 50%（半分）到達の判定
          const halfTime = Math.floor(totalSeconds / 2);
          if (!halfAnnounced && remainingSeconds === halfTime && remainingSeconds > 0) {
            halfAnnounced = true;
            speak('はんぶーん');
          }

          if (remainingSeconds === 0) {
            finishTimer();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      startPauseBtn.classList.remove('btn-danger');
      startPauseBtn.classList.add('btn-primary');
      btnIcon.textContent = '▶';
      btnText.textContent = 'スタート';
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = totalSeconds;
      halfAnnounced = false;
      document.body.classList.remove('finished-flash');
      updateDisplay();
    }

    function finishTimer() {
      pauseTimer();
      document.body.classList.add('finished-flash');
      playAlarmSound();
      speak('おわりー');
      
      // 終了時に自動的にリセット状態（初期時間）に戻す
      resetTimer();
    }

    // Set duration from presets or fine adjustment
    function setDuration(seconds) {
      totalSeconds = seconds;
      remainingSeconds = seconds;
      halfAnnounced = false;
      document.body.classList.remove('finished-flash');
      if (isRunning) {
        pauseTimer();
      }
      updateDisplay();
    }

    // Event Listeners
    startPauseBtn.addEventListener('click', () => {
      document.body.classList.remove('finished-flash');
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    // Mute Toggle
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
      muteBtn.classList.toggle('muted', isMuted);
    });

    // Preset Buttons Click
    presetBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        presetBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const time = parseInt(btn.dataset.time, 10);
        setDuration(time);
      });
    });

    // Fine Adjust (+1m / -1m)
    plusMinBtn.addEventListener('click', () => {
      const newTime = remainingSeconds + 60;
      setDuration(newTime);
    });

    minusMinBtn.addEventListener('click', () => {
      if (remainingSeconds > 60) {
        setDuration(remainingSeconds - 60);
      }
    });

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        startPauseBtn.click();
      } else if (e.code === 'KeyR') {
        e.preventDefault();
        resetBtn.click();
      }
    });

    // Initial Display Setup
    updateDisplay();
  </script>
</body>
</html>
